name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests scripts
      - name: JavaScript syntax
        run: node --check src/vulnscan/web/static/js/app.js
      - name: Tests with coverage
        run: pytest -q --cov=vulnscan --cov-report=term-missing --cov-fail-under=75
      - name: Build wheel
        run: python -m pip wheel . --no-deps -w dist
      - name: Wheel install smoke
        run: |
          set -euo pipefail
          python -m pip install --no-deps --force-reinstall dist/*.whl
          python -c "import pathlib, vulnscan; print(vulnscan.__version__); print(pathlib.Path(vulnscan.__file__).resolve())"
          echo "version import ok"
          python -c "from importlib.resources import files; assert files('vulnscan').joinpath('web/templates/trends.html').is_file(); print('template data ok')"
          vulnscan --help > /dev/null
          echo "cli help ok"
          vulnscan rules > /dev/null
          echo "rules command ok"
          python -c "import os, re, subprocess, sys; r = subprocess.run([sys.executable, '-m', 'vulnscan', 'diff', '--help'], capture_output=True, text=True, env={**os.environ, 'NO_COLOR': '1', 'TERM': 'dumb'}); text = re.sub(r'\x1b\[[0-9;]*m', '', r.stdout); assert r.returncode == 0, r.stderr; assert '--fail-on' in text, text; print('diff help ok')"
      - name: Seed diff gate fixture
        run: python scripts/ci_gate_fixture.py --data-dir /tmp/vulnscan-ci-gate
      - name: Diff gate fails on confirmed regression
        run: |
          set +e
          vulnscan diff --current ci_gate_fail_current --baseline --fail-on new_confirmed --data-dir /tmp/vulnscan-ci-gate
          code=$?
          set -e
          if [ "$code" -ne 1 ]; then
            echo "Expected exit code 1, got $code"
            exit 1
          fi
      - name: Diff gate passes on pending finding
        run: |
          vulnscan diff --current ci_gate_pass_current --baseline --fail-on new_confirmed --data-dir /tmp/vulnscan-ci-gate

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e ".[dev,browser]"
      - name: Install Chromium
        run: playwright install --with-deps chromium
      - name: GUI smoke
        env:
          VULNSCAN_E2E: "1"
        run: pytest -q tests/e2e
