[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vulnscan"
version = "0.24.0"
description = "Authorized, non-destructive web vulnerability scanner with a local web UI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "jinja2>=3.1",
  "httpx>=0.27",
  "sqlmodel>=0.0.22",
  "selectolax>=0.3.21",
  "typer>=0.12",
  "pyyaml>=6.0",
  "python-multipart>=0.0.9",
  "pydantic>=2.14.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5",
  "respx>=0.21",
  "ruff>=0.6",
]
browser = [
  "playwright>=1.45",
]

[project.scripts]
vulnscan = "vulnscan.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vulnscan = [
  "web/templates/*.html",
  "web/static/css/*.css",
  "web/static/js/*.js",
  "web/static/*.svg",
  "report/templates/*.html",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["B008", "RUF001", "RUF002", "RUF003", "UP042"]
